[package]
name = "rplcs_tournament_1_http"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"

[dependencies]
rplcs_events = { workspace = true }
petgraph = { workspace = true }
rand = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
layout-rs = { workspace = true }
round_robin = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
env_logger = "0.11"

r2d2_sqlite = "0.26"
r2d2 = "0.8"
rusqlite = { version = "0.33", features = ["bundled"] }

[dev-dependencies]
quickcheck = "1"
quickcheck_macros = "1"
